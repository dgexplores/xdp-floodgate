# CI/CD:
#   every PR and push -> `test` (lint, build, unit, in-kernel verifier tests)
#   push to main      -> `release` waits for the owner's Approve/Reject
#                        (environment "production"), then publishes the image.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev
          # asm/types.h lives in an arch dir that clang -target bpf doesn't search
          sudo ln -sf /usr/include/$(uname -m)-linux-gnu/asm /usr/include/asm

      - name: Generate (compile BPF with clang)
        run: go generate ./...

      - name: Lint
        run: |
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
          go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

      # Loads the real program into the runner's kernel: the verifier must
      # accept it, then BPF_PROG_RUN checks verdicts. Needs root.
      - name: Verifier + BPF_PROG_RUN tests
        run: |
          go test -c -o loader.test ./internal/loader
          sudo ./loader.test -test.v -test.count=1

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required reviewers on this environment pause the job until approved.
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
